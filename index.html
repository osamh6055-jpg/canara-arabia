          document.documentElement.setAttribute('lang', next);
          document.documentElement.setAttribute('dir', next === 'ar' ? 'rtl' : 'ltr');
          return next;
        });
      }, []);
      return (
        <LangContext.Provider value={{ lang, t, toggleLang, isRTL: lang === 'ar' }}>
          {children}
        </LangContext.Provider>
      );
    }

// جلب القطع من Supabase عند فتح لوحة التحكم

    const handleSaveProduct = async (e) => {
        e.preventDefault();
        setSaving(true);

        const payload = {
            name_ar: currentPart.title,
            name_en: currentPart.title_en,
            part_number: currentPart.partno,

            fetchProducts(); // إعادة تحديث القائمة فوراً
        }
        setSaving(false);
    };
      
      const showToast = (msg, isError = false) => {
        setToast({ msg, show: true, isError });
        setTimeout(() => setToast({ msg: '', show: false, isError: false }), 4000);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const json = XLSX.utils.sheet_to_json(worksheet);

            if (!json || json.length === 0) {
              showToast('الملف المرفوع فارغ أو لا يحتوي على بيانات صحيحة', true);
              return;
            }

            let addedCount = 0;
            let currentList = [...products];

            json.forEach((row) => {
              const partno = String(row['رقم القطعة'] || row['PartNo'] || row['partno'] || row['Part No'] || '').trim();
              const title = String(row['اسم القطعة'] || row['Title'] || row['title'] || row['Name'] || '').trim();
              const title_en = String(row['الاسم بالانجليزي'] || row['TitleEn'] || row['title_en'] || row['English Title'] || '').trim();
              let eq_type = String(row['نوع المعدة'] || row['EquipmentType'] || row['eq_type'] || 'CATERPILLAR').toUpperCase().trim();
              if (!['CATERPILLAR', 'JCB', 'BOBCAT'].includes(eq_type)) eq_type = 'CATERPILLAR';
              let brand = String(row['الماركة'] || row['Brand'] || row['brand'] || 'ITR').toUpperCase().trim();
              let category = String(row['التصنيف'] || row['Category'] || row['category'] || 'engine').toLowerCase().trim();
              let status = String(row['الحالة'] || row['Status'] || row['status'] || 'instock').toLowerCase().trim();
              if (status.includes('طلب') || status.includes('custom')) status = 'custom';
              else status = 'instock';
              const img_url = String(row['رابط الصورة'] || row['ImageUrl'] || row['img_url'] || 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=600').trim();
              const description = String(row['الوصف'] || row['Description'] || row['description'] || '').trim();

              if (partno && title) {
                const exists = currentList.some((p) => p.partno.toLowerCase() === partno.toLowerCase() && p.brand.toLowerCase() === brand.toLowerCase());
                if (!exists) {
                  const newPart = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    title,
                    title_en,
                    partno,
                    eq_type,
                    brand,
                    category,
                    status,
                    img_url,
                    description
                  };
                  currentList.unshift(newPart);
                  addedCount++;
                }
              }
            });

            setProducts(currentList);
            localStorage.setItem('canara_products', JSON.stringify(currentList));
            showToast(`تم استيراد ${addedCount} قطعة جديدة بنجاح من ملف الـ Excel!`);
            e.target.value = '';
          } catch (err) {
            console.error(err);
            showToast('حدث خطأ أثناء قراءة ملف الـ Excel. تأكد من صحة الأعمدة.', true);
          }
        };
        reader.readAsArrayBuffer(file);
      };

            "الوصف": "طقم بساتم أصلي عالي الجودة لمواتير الديزل الثقيلة"
          }
        ];
        const ws = XLSX.utils.json_to_sheet(templateData);
        const wb = XLSX.utils.book_new();

            return;
          }

          let updated;
          if (isEditing) {
            updated = products.map((p) => (p.id === currentPart.id ? currentPart : p));
            showToast('تم تعديل بيانات القطعة بنجاح');
          } else {
            const newItem = { ...currentPart, id: Date.now().toString() };
            updated = [newItem, ...products];
            showToast('تم إضافة القطعة الجديدة بنجاح للكتالوج');
          }
          setProducts(updated);
          localStorage.setItem('canara_products', JSON.stringify(updated));
          setModalOpen(false);
        } catch {
          showToast('حدث خطأ أثناء الحفظ', true);
        }
        setSaving(false);
      };

      const handleDelete = (id) => {
        if (!window.confirm('هل أنت متأكد من رغبتك في حذف هذه القطعة من الكتالوج؟')) return;
        try {
          const updated = products.filter((p) => p.id !== id);
          setProducts(updated);
          localStorage.setItem('canara_products', JSON.stringify(updated));
          showToast('تم حذف القطعة من الكتالوج');

          showToast('حدث خطأ أثناء الحذف', true);

    function AppContent() {
      const [view, setView] = useState('home');

      useEffect(() => {
        if (window.location.hash === '#admin-panel') setView('admin');
      }, []);

      useEffect(() => {
        const handleHash = () => {
          if (window.location.hash === '#admin-panel') setView('admin');
          else if (view === 'admin') setView('home');
        };
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, [view]);

      const navigate = useCallback((targetView, sectionId) => {
        setView(targetView);
        if (targetView === 'home' && sectionId) {
          setTimeout(() => {
            const el = document.getElementById(sectionId);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 80);
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }, []);

      const handleLogout = useCallback(() => {
        setView('home');
        window.location.hash = '';
      }, []);

      if (view === 'admin') {
        return <AdminView onNavigate={navigate} onLogout={handleLogout} />;
      }

      return (
        <div className="bg-white text-gray-800 antialiased selection:bg-[#F4B41A] selection:text-[#1E1E1E] min-h-screen">
          <Navbar onNavigate={navigate} />
          {view === 'home' && <HomeView onNavigate={navigate} />}
          {view === 'products' && <ProductsView onNavigate={navigate} />}
          <Footer onNavigate={navigate} />
        </div>
      );
    }

      return (
        <LangProvider>
          <AppContent />
        </LangProvider>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
